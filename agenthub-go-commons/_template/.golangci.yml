linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - noctx
    - bodyclose

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
  goimports:
    local-prefixes: github.com/AgentHub-Studio/agenthub-go-commons

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
        - gocritic
