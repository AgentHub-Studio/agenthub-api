apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-api
  namespace: agenthub
  labels:
    app: agenthub-api
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-api
  template:
    metadata:
      labels:
        app: agenthub-api
        version: go
    spec:
      containers:
        - name: agenthub-api
          image: registry.local/agenthub-api:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-secret-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-api
  namespace: agenthub
spec:
  selector:
    app: agenthub-api
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthub-api-config
  namespace: agenthub
data:
  LOG_LEVEL: "info"
  PORT: "8081"
