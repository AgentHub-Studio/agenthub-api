---
# agenthub-api — Go monolith (replaces agenthub-backend + marketplace + package-registry)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-api
  namespace: agenthub
  labels:
    app: agenthub-api
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-api
  template:
    metadata:
      labels:
        app: agenthub-api
        version: go
    spec:
      containers:
        - name: api
          image: localhost:5000/agenthub-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agenthub-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: DATABASE_URL
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: MINIO_ROOT_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-api
  namespace: agenthub
  labels:
    app: agenthub-api
spec:
  selector:
    app: agenthub-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
