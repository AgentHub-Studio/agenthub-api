name: Integration tests

on:
  push:
    branches: [develop, main]
    paths:
      - "internal/domain/chat/agentic/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [develop]
    paths:
      - "internal/domain/chat/agentic/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch: {}

jobs:
  agentic-runner:
    name: Runner integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout agenthub-go-commons
        uses: actions/checkout@v4
        with:
          repository: AgentHub-Studio/agenthub-go-commons
          path: _go_commons

      - name: Link go-commons to /agenthub-go-commons
        run: sudo ln -s "$GITHUB_WORKSPACE/_go_commons" /agenthub-go-commons

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet -tags=integration ./internal/domain/chat/agentic/...

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 -v ./internal/domain/chat/agentic/...
